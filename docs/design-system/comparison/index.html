<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AstroDX · 设计语言比较</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:13px system-ui,sans-serif;background:#f5f5f5;color:#242424}
    .review-bar{height:44px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid #dedede;background:#fff;white-space:nowrap;overflow-x:auto}
    .review-bar label{display:flex;align-items:center;gap:6px}select{height:32px;font:inherit;border:1px solid #c7c7c7;border-radius:4px;background:white;color:inherit;padding:0 8px}strong{font-weight:650}.state{margin-left:auto;color:#616161;font-size:12px}
    iframe{display:block;border:0;width:100%;height:calc(100dvh - 44px)}
    @media(max-width:600px){.review-bar{gap:10px;padding:0 10px}.review-bar strong{display:none}.state{display:none}}
  </style>
  <script defer src="preview.js"></script>
</head>
<body>
  <div class="review-bar">
    <strong>AstroDX 设计比较</strong>
    <label>风格 <select id="style"><option value="fluent">Fluent 2</option><option value="expressive">Material 3 Expressive</option><option value="material2">Material 2 · 4px</option><option value="material2-sharp">Material 2 · 直角</option></select></label>
    <label>页面 <select id="page"><option value="search">搜谱</option><option value="detail">谱面详情</option><option value="downloads">下载管理器</option></select></label>
    <span class="state" id="state">仅开发预览 · 未发布</span>
  </div>
  <iframe title="AstroDX 视觉样板" id="preview"></iframe>
</body>
</html>
