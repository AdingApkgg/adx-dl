# 本机开发和测试用。端口只绑本机，并且换成不常用的端口号，避免和本机已有的 PG/Redis 冲突。
name: astrodx-community-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community
      POSTGRES_DB: community
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # PG 18 镜像的数据卷挂载点是 /var/lib/postgresql（不再是 .../data）。
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"

  # Generate .storage-dev/s3.json using ops/seaweed/write-config.ts before first start.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # Keep the generated 0600 fixture private. The image's default entrypoint
    # drops to an unrelated UID, which cannot read a GitHub runner-owned fixture.
    entrypoint: ["/usr/bin/weed"]
    user: "0:0"
    command: ["mini", "-dir=/data", "-s3.port=8333", "-bucket=blobs,derived", "-s3.config=/config/s3.json"]
    ports:
      - "127.0.0.1:58333:8333"
    volumes:
      - storage-data:/data
      - type: bind
        source: ./.storage-dev/s3.json
        target: /config/s3.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      NO_PROXY: seaweedfs,localhost,127.0.0.1

volumes:
  storage-data:
  pgdata:
