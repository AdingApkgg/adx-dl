<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroDX OG Image</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          linear-gradient(145deg, rgba(66, 177, 255, 0.28) 0%, transparent 28%),
          linear-gradient(26deg, transparent 0%, rgba(43, 96, 255, 0.28) 55%, transparent 82%),
          linear-gradient(180deg, #020617 0%, #06153c 56%, #071f62 100%);
        color: #f8fbff;
      }

      .frame {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 54px 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        inset: auto;
        pointer-events: none;
      }

      .frame::before {
        top: 0;
        right: 170px;
        width: 240px;
        height: 630px;
        transform: skewX(-18deg);
        background: linear-gradient(180deg, rgba(108, 206, 255, 0.2), transparent 72%);
      }

      .frame::after {
        right: 0;
        bottom: 0;
        width: 560px;
        height: 160px;
        background: linear-gradient(180deg, transparent, rgba(20, 67, 169, 0.34));
      }

      .copy {
        position: relative;
        z-index: 1;
        max-width: 720px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border: 1px solid rgba(150, 201, 255, 0.26);
        border-radius: 999px;
        background: rgba(8, 19, 53, 0.54);
        color: #b5d9ff;
        font-size: 18px;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .title {
        margin: 22px 0 14px;
        font-size: 96px;
        line-height: 0.96;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        color: #d6e8ff;
        font-size: 28px;
        line-height: 1.34;
        max-width: 690px;
      }

      .meta {
        display: flex;
        gap: 14px;
        margin-top: 28px;
        flex-wrap: wrap;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 180px;
        height: 64px;
        padding: 0 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #ebf5ff;
        font-size: 20px;
      }

      .chip:first-child {
        min-width: 244px;
      }

      .mark {
        position: relative;
        z-index: 1;
        width: 300px;
        height: 300px;
        margin-right: 12px;
        border-radius: 44px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03)),
          rgba(5, 12, 34, 0.72);
        border: 1px solid rgba(143, 186, 255, 0.2);
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.48),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
      }

      .mark img {
        width: 188px;
        height: 188px;
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section class="copy">
        <div class="eyebrow">AstroDX Archive</div>
        <h1 class="title">AstroDX</h1>
        <p class="subtitle">
          Community-driven chart archive, indexing, and download portal for
          AstroDX collections.
        </p>
        <div class="meta">
          <span class="chip">Official Packages</span>
          <span class="chip">Chart Index</span>
          <span class="chip">Downloads</span>
        </div>
      </section>
      <section class="mark">
        <img src="../original/app-icon-xhdpi.png" alt="AstroDX app icon" />
      </section>
    </main>
  </body>
</html>
