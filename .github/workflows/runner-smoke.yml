name: Managed runner smoke

# 验证 runner；可单独测量上一轮 Web CI 的 Pages 打包与上传，不发布。
on:
  workflow_dispatch:
    inputs:
      pages_archive:
        description: Benchmark the preceding Web CI archive (run Web check first)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    if: contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/pre"]'), github.ref) && !inputs.pages_archive
    runs-on: [self-hosted, linux, x64, astrodx-ci]
    timeout-minutes: 10
    services:
      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        ports:
          - "6379"
    steps:
      - name: Inspect CPU and isolated runner identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner name: %s\nContainer hostname: %s\n' "$RUNNER_NAME" "$(hostname)"
          id
          test "$(id -u)" -ne 0
          test -f /.dockerenv
          lscpu
          printf 'Available CPUs: %s\nOnline host CPUs: %s\n' "$(nproc)" "$(getconf _NPROCESSORS_ONLN)"
          if [ -f /sys/fs/cgroup/cpu.max ]; then
            printf 'CPU quota: '
            cat /sys/fs/cgroup/cpu.max
          fi
          if [ -f /sys/fs/cgroup/memory.max ]; then
            printf 'Memory limit: '
            cat /sys/fs/cgroup/memory.max
          fi
          docker version
          docker info --format 'Docker server: {{.Name}} ({{.ID}})'

      - name: Check Docker service connectivity
        shell: bash
        env:
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import socket

          with socket.create_connection(("127.0.0.1", int(os.environ["REDIS_PORT"])), timeout=15) as connection:
              connection.sendall(b"*1\r\n$4\r\nPING\r\n")
              with connection.makefile("rb") as response:
                  assert response.readline() == b"+PONG\r\n"
          print("Docker service responds on its dynamically assigned port.")
          PY

      - name: Check the workspace volume shared with Docker
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$RUNNER_TEMP/runner-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          probe_value="managed-ci:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          mkdir -p "$probe_dir"
          trap 'rm -rf "$probe_dir"' EXIT
          printf '%s\n' "$probe_value" > "$probe_dir/input"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$probe_dir,target=/probe" \
            redis:8 sh -ec '
              test "$(cat /probe/input)" = "$1"
              printf "%s\n" "$1" > /probe/output
            ' sh "$probe_value"
          test "$(cat "$probe_dir/output")" = "$probe_value"
          printf 'Runner and Docker can read/write the same workspace volume.\n'

  # GitHub 的 job container 还要能访问 /__w、/__e 和 /__t，不能只验证 docker run。
  container_smoke:
    if: contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/pre"]'), github.ref) && !inputs.pages_archive
    runs-on: [self-hosted, linux, x64, astrodx-ci]
    timeout-minutes: 10
    container:
      image: node:24-bookworm
      # 与持久卷的 runner 所有者一致，避免后续 host job 无法清理 root 文件。
      options: --user 1001:123
    steps:
      - name: Checkout inside the job container
        uses: actions/checkout@v7

      - name: Setup Node inside the job container
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the job container workspace and tool cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");

          const workspace = process.env.GITHUB_WORKSPACE;
          const toolCache = process.env.RUNNER_TOOL_CACHE;
          assert.ok(workspace, "GITHUB_WORKSPACE is set");
          assert.equal(toolCache, "/__t", "the job container sees the shared tool cache");
          assert.ok(fs.readFileSync(path.join(workspace, "README.md"), "utf8").length > 0);
          const manifest = JSON.parse(fs.readFileSync(path.join(workspace, "package.json"), "utf8"));
          assert.equal(manifest.name, "astrodx");
          fs.accessSync(toolCache, fs.constants.R_OK | fs.constants.W_OK);
          assert.ok(fs.existsSync(path.join(toolCache, "node")), "setup-node populated the tool cache");
          assert.ok(process.execPath.startsWith(path.join(toolCache, "node") + path.sep));
          assert.equal(process.versions.node.split(".")[0], "24");
          console.log(`Node ${process.versions.node}: workspace ${workspace}, tool cache ${toolCache}`);
          console.log("The job container can run Node and read the checked-out repository.");
          NODE

  pages_archive:
    if: inputs.pages_archive && contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/pre"]'), github.ref)
    runs-on: [self-hosted, linux, x64, astrodx-ci]
    timeout-minutes: 20
    steps:
      # Checkout would delete the preceding build. Require the same commit and
      # source output instead; this benchmark never invokes deploy-pages.
      - name: Verify the preceding build and same-volume Bun cache
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat apps/web/.next/ci-build-sha)" = "$GITHUB_SHA"
          test -f apps/web/out/index.html
          test -n "$BUN_INSTALL_CACHE_DIR"
          probe="$(mktemp "$BUN_INSTALL_CACHE_DIR/.hardlink-probe.XXXXXX")"
          linked="$GITHUB_WORKSPACE/.hardlink-probe-$GITHUB_RUN_ID"
          trap 'rm -f -- "$probe" "$linked"' EXIT
          ln "$probe" "$linked"
          printf 'Bun cache hardlink succeeds: %s\n' "$BUN_INSTALL_CACHE_DIR"

      # Keep the invocation identical to deploy-gh-pages.yml.
      - name: Package Pages artifact
        run: |
          started=$SECONDS
          tar --dereference --hard-dereference \
            --directory "$GITHUB_WORKSPACE/apps/web/out" \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github --exclude='.[^/]*' .
          printf 'Pages archive: %s bytes; packing: %s seconds\n' \
            "$(stat -c '%s' "$RUNNER_TEMP/artifact.tar")" "$((SECONDS - started))"

      - name: Upload benchmark Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
