name: Build and Publish gh-pages

# 推送不触发部署，发布是一个手动动作：
# - workflow_dispatch：发布所选分支的最新提交。GitHub 的 Actions 页、`gh workflow run`、
#   dash 的 Actions 面板都能触发。成功后把 `pages-live` 标签移到这个提交上。
# - schedule：重建 `pages-live` 指向的提交，只为轮换首页精选、吃进上游新数据，
#   不会把 main 上还没发布的代码带上线。
# 推送和 PR 的检查（lint、类型、测试、构建）在 web-check.yml。
on:
  workflow_dispatch:
  schedule:
    # Daily 04:00 Asia/Shanghai (20:00 UTC): rotates the homepage spotlight /
    # featured picks, whose seed is the build day (see featured-selection.ts).
    - cron: "0 20 * * *"

# Artifact-based GitHub Pages deploy (no gh-pages branch). Jobs widen this as needed.
permissions:
  contents: read

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 决定这次构建哪个提交，以及 IndexNow 拿哪个提交做对比基准。
  # 线上版本记在 `pages-live` 标签上，而不是查部署记录：部署记录存的是触发这次
  # 运行的 github.sha，定时任务的 github.sha 永远是 main 的最新提交，和它实际
  # 检出构建的提交对不上，跑过一次记录就指向了没发布的代码。
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.pick.outputs.build_sha }}
      live_sha: ${{ steps.pick.outputs.live_sha }}
    steps:
      - name: Pick the commit to build
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/pages-live" --jq .object.sha 2>/dev/null || true)"
          # 标签不存在时 gh 会把 404 的 JSON 写到标准输出（--jq 也拦不住），只认 40 位十六进制的提交号。
          if ! [[ "$live_sha" =~ ^[0-9a-f]{40}$ ]]; then
            live_sha=""
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            build_sha="$live_sha"
            if [ -z "$build_sha" ]; then
              echo "::warning::pages-live 标签还不存在（还没有手动发布过），跳过这次定时重建。"
            fi
          else
            build_sha="${{ github.sha }}"
          fi

          echo "build_sha=$build_sha" >> "$GITHUB_OUTPUT"
          echo "live_sha=$live_sha" >> "$GITHUB_OUTPUT"

  # 重构建只读；生产发布及其写权限继续留在 GitHub runner。
  build:
    needs: resolve
    if: needs.resolve.outputs.build_sha != ''
    runs-on: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/pre"]'), github.ref))) && '["self-hosted","linux","x64","astrodx-ci"]' || '["ubuntu-latest"]') }}

    steps:
      # 定时任务必须构建 pages-live 的旧提交，不能把 main 上未发布的代码带上线。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.build_sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 以根 package.json 的 packageManager 为唯一版本来源。定时重建旧提交时，
          # 用的也是那个提交当时固定的版本。
          bun-version-file: package.json

      # 自托管镜像不预装系统 Node；依赖安装和 CLI 的 node shebang 都需要它。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Covers (AVIF/WebP) are served from Cloudflare R2, not mirrored into the
      # Pages build — so no libavif/cwebp install and no cover cache. build_catalog
      # points cover_avif/webp at R2 by default (ASTRODX_COVERS=local re-enables the
      # legacy local mirror, which would also need the encoders reinstated).
      - name: Build catalog
        working-directory: pipeline
        # Falls back to the committed catalog (with a warning) when the origin on
        # alice is unreachable; other failures still fail the job.
        run: python3 -m tools.ci_build_catalog

      # maidata.txt is committed under apps/web/public/adxcs/<shortid>/ (served
      # same-origin for the .adx download + chart preview), so there is no mirror
      # step and no build-time fetch. When charts are added, re-run
      # `python3 -m tools.mirror_chart_assets --root ..` locally and commit the
      # new maidata files.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # build_catalog above rewrites index.json from upstream and knows nothing
      # about note counts, chart duration, BPM ranges, measured download sizes or
      # romaji — those come from parsing every maidata with the SAME simai parser
      # the in-browser preview uses, which is TypeScript and lives in the web
      # workspace. So it has to run after `bun install`, and it has to run on
      # every deploy: skip it and the detail pages silently lose every number
      # they quote. ~75s for 1875 charts. Per-chart failures are logged and
      # skipped, so only something systemic fails the job.
      - name: Enrich chart details
        working-directory: apps/web
        run: bun run enrich:details

      # Next.js build cache (module graph, compiled pages) across runs.
      - name: Restore local Next.js cache
        id: local_next_cache
        if: runner.environment == 'self-hosted'
        run: python3 /etc/gha-runner/next-build-cache.py restore

      - name: Cache Next.js build
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('bun.lock') }}-${{ needs.resolve.outputs.build_sha }}
          restore-keys: next-${{ hashFiles('bun.lock') }}-

      - name: Test content schema
        working-directory: packages/content-schema
        run: bun test

      # Fast quality gate before the expensive build: full builds no longer run
      # locally, so CI is where type errors and test regressions get caught.
      - name: Typecheck and test
        working-directory: apps/web
        run: bun run check

      - name: Build site
        working-directory: apps/web
        # Next 16 默认按宿主机 CPU 数创建 worker；自托管构建限制为 8 个。
        env:
          CIRCLE_NODE_TOTAL: ${{ runner.environment == 'self-hosted' && '9' || '' }}
          ASTRODX_CI_EXPORT_LINKS: ${{ runner.environment == 'self-hosted' && '1' || '' }}
          NODE_OPTIONS: ${{ runner.environment == 'self-hosted' && '--require /etc/gha-runner/next-export-links.cjs' || '' }}
        run: |
          if [ -r /sys/fs/cgroup/memory.events ]; then
            printf 'Before build: memory events\n'
            cat /sys/fs/cgroup/memory.events
          fi
          bun run build

      # Keep this inline: scheduled builds may check out an older pages-live.
      - name: Inspect export and trim static build intermediates
        if: runner.environment == 'self-hosted'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [event for line in Path("apps/web/.next/trace").read_text().splitlines() for event in json.loads(line)]
          for name in ("next-build", "static-generation", "output-export-full-static-export"):
              durations = [event["duration"] / 1_000_000 for event in events if event["name"] == name]
              if durations:
                  print(f"Next trace {name}: {max(durations):.3f} seconds")
          PY
          test -f apps/web/out/index.html
          du -sh apps/web/.next/server apps/web/out
          started=$SECONDS
          rm -rf -- apps/web/.next/server
          printf 'Intermediate cleanup: %s seconds\n' "$((SECONDS - started))"
          cat /sys/fs/cgroup/memory.events /sys/fs/cgroup/io.pressure

      - name: Persist local Next.js cache
        if: always() && runner.environment == 'self-hosted' && steps.local_next_cache.outcome == 'success'
        run: python3 /etc/gha-runner/next-build-cache.py save

      # Official v5 Linux tar recipe, without verbose per-file stdout.
      # Inline so scheduled builds can still check out an older pages-live.
      - name: Package Pages artifact
        run: |
          started=$SECONDS
          tar --dereference --hard-dereference \
            --directory "$GITHUB_WORKSPACE/apps/web/out" \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github --exclude='.[^/]*' .
          printf 'Pages archive: %s bytes; packing: %s seconds\n' \
            "$(stat -c '%s' "$RUNNER_TEMP/artifact.tar")" "$((SECONDS - started))"

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      # IndexNow 要对比的是本次实际生成并发布的目录，不能在发布 job 中重新生成。
      - name: Upload IndexNow catalog
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-catalog
          path: data/catalog/index.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # IndexNow 使用同一版本的脚本，并取完整历史与发布前目录做 diff。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.build_sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download IndexNow catalog
        uses: actions/download-artifact@v8
        with:
          name: indexnow-catalog
          path: data/catalog

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Submit IndexNow
        continue-on-error: true
        working-directory: apps/web
        # Key file, site URL, and CNAME all ship in the repo — no Actions secrets or variables needed.
        # INDEXNOW_BASE_REF 是这次发布前的线上提交（pages-live），只提交真正变了的谱面和页面。
        # 定时重建时它就是正在构建的提交，于是只剩上游数据带来的变化；标签还不存在时
        # 为空，脚本退回全量提交。
        env:
          INDEXNOW_BASE_REF: ${{ needs.resolve.outputs.live_sha }}
        run: bun run submit:indexnow

  # 只有手动发布才移动 `pages-live`；定时重建构建的本来就是它指向的提交。
  # 标签写权限只给这个不装第三方 action 的 job，构建 job 仍然只读。
  mark-live:
    needs: [resolve, deploy]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Move pages-live to the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.build_sha }}
        run: |
          repo="repos/${{ github.repository }}"
          if gh api "$repo/git/ref/tags/pages-live" >/dev/null 2>&1; then
            gh api -X PATCH "$repo/git/refs/tags/pages-live" -f sha="$SHA" -F force=true
          else
            gh api "$repo/git/refs" -f ref=refs/tags/pages-live -f sha="$SHA"
          fi
