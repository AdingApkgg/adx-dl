name: Build and Publish gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Artifact-based GitHub Pages deploy (no gh-pages branch).
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Covers (AVIF/WebP) are served from Cloudflare R2, not mirrored into the
      # Pages build — so no libavif/cwebp install and no cover cache. build_catalog
      # points cover_avif/webp at R2 by default (ASTRODX_COVERS=local re-enables the
      # legacy local mirror, which would also need the encoders reinstated).
      - name: Build catalog
        working-directory: pipeline
        run: python3 -c "from pathlib import Path; from tools.build_catalog import build_catalog; print(build_catalog(Path('..').resolve(), max_workers=16))"

      # Only maidata.txt is mirrored to the static site now (same-origin fetch for
      # the .adx download + chart preview); bg.png/audio/video come from R2. The
      # adxcs-v2 key busts the old cache that still held the ~945 MB of bg.png.
      - name: Cache mirrored chart assets
        uses: actions/cache@v6
        with:
          path: apps/web/public/adxcs
          key: adxcs-v2-${{ github.run_id }}
          restore-keys: adxcs-v2-

      - name: Mirror chart assets for local downloads
        working-directory: pipeline
        run: python3 -m tools.mirror_chart_assets --root .. --max-workers 16

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Next.js build cache (module graph, compiled pages) across runs.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('bun.lock') }}-

      - name: Build site
        working-directory: apps/web
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Submit IndexNow
        continue-on-error: true
        working-directory: apps/web
        # Key file, site URL, and CNAME all ship in the repo — no Actions secrets or variables needed.
        run: bun run submit:indexnow
