name: Dash check

# 主站的 deploy 工作流用 paths-ignore 排除了 apps/dash，所以 dash 的类型检查
# 与单测由这条工作流负责。它只跑 check，不构建镜像、不部署 —— 部署是 g510 上
# 手动 docker compose 拉起的，不经 GitHub。
on:
  push:
    branches:
      - main
    paths:
      - "apps/dash/**"
      - "bun.lock"
      - ".github/workflows/dash-check.yml"
  pull_request:
    paths:
      - "apps/dash/**"
      - "bun.lock"
      - ".github/workflows/dash-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        working-directory: apps/dash
        run: bun run check
