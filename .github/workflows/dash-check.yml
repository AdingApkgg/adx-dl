name: Dash check

# 主站的检查（web-check.yml）只看主站相关路径，部署工作流也不再由推送触发，
# 所以 dash 的类型检查与单测由这条工作流负责。它只跑 check，不构建镜像、不部署
# —— 部署是 g510 上手动 docker compose 拉起的，不经 GitHub。
on:
  push:
    # Check on main, dev, and pre. The pre branch is what the g510 deployment
    # is built from, so it must not receive unchecked commits.
    branches:
      - main
      - dev
      - pre
    paths:
      - "apps/dash/**"
      - "packages/content-schema/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "biome.jsonc"
      - ".github/workflows/dash-check.yml"
  pull_request:
    paths:
      - "apps/dash/**"
      - "packages/content-schema/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "biome.jsonc"
      - ".github/workflows/dash-check.yml"
  # Lets the dashboard's Actions panel dispatch this workflow on demand: it's
  # the cheap one (~20s) to verify the dispatch path against, versus the site
  # deploy's 7+ minutes. Not subject to the `paths` filters above — a manual
  # run always runs, which is what "on demand" should mean.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # 公开仓库的 PR 留在 GitHub runner；自托管 runner 另有主机侧事件白名单。
    runs-on: ${{ fromJSON(((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/pre"]'), github.ref)) && '["self-hosted","linux","x64","astrodx-ci"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 以根 package.json 的 packageManager 为唯一版本来源。定时重建旧提交时，
          # 用的也是那个提交当时固定的版本。
          bun-version-file: package.json

      # 自托管镜像不预装系统 Node；依赖安装和 CLI 的 node shebang 都需要它。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test content schema
        working-directory: packages/content-schema
        run: bun test

      - name: Typecheck and test
        working-directory: apps/dash
        run: bun run check

      # bun run build was never part of CI, so the build path had only ever run
      # on one developer's Mac. A real deploy to g510 failed at this exact step
      # (ECONNREFUSED from the SPA prerender, plus a separate entry.server.tsx
      # 500 under bun's node shim — see apps/dash/vite.config.ts and Dockerfile
      # for the fixes). A build that only ever runs at deploy time makes
      # deployment the place you discover build breakage, which is the most
      # expensive place to discover it. This step is NOT a substitute for a
      # deploy rehearsal: ubuntu-latest here isn't the oven/bun container that
      # ships to g510, so it will not reproduce that container's IPv6-only
      # preview-server binding or its node-shim behaviour. It only catches
      # build breakage in general (syntax errors, type errors that slip past
      # tsc in build-only codepaths, broken imports, etc.).
      - name: Build
        working-directory: apps/dash
        run: bun run build
