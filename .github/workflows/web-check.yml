name: Web check

# 主站推送和 PR 只检查、不部署；发布是手动的，见 deploy-gh-pages.yml。
# 步骤和部署工作流的前半段保持一致（生成目录 → 补全谱面信息 → 类型检查与测试 → 构建），
# "检查通过"才基本等于"发布时也能构建成功"。本机不跑 next build，构建只在这里验证。
on:
  push:
    branches:
      - main
      - dev
      - pre
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pipeline/**"
      - "data/**"
      - "patches/**"
      - "scripts/generate-motion-css.ts"
      - "package.json"
      - "bun.lock"
      - "biome.jsonc"
      - ".github/workflows/web-check.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pipeline/**"
      - "data/**"
      - "patches/**"
      - "scripts/generate-motion-css.ts"
      - "package.json"
      - "bun.lock"
      - "biome.jsonc"
      - ".github/workflows/web-check.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续推送时，前一轮没跑完的检查已经没有意义。
concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 主站检查统一使用 GitHub 托管 runner，避免与自托管磁盘负载争用。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 以根 package.json 的 packageManager 为唯一版本来源。定时重建旧提交时，
          # 用的也是那个提交当时固定的版本。
          bun-version-file: package.json

      # 显式选择 Node 版本，保持依赖安装、CLI 和测试环境一致。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build catalog
        working-directory: pipeline
        # Falls back to the committed catalog (with a warning) when the origin on
        # alice is unreachable; other failures still fail the job.
        run: python3 -m tools.ci_build_catalog

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 同部署工作流：详情页的物量、时长、BPM 等数字都靠这一步，构建前必须跑。
      - name: Enrich chart details
        working-directory: apps/web
        run: bun run enrich:details

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('bun.lock') }}-

      - name: Lint
        run: bun run lint

      # 共享界面包（@astrodx/ui）只放源码：web 的 tsc 只检查用到的文件，包自己的测试也要跑。
      - name: Typecheck and test the shared UI package
        working-directory: packages/ui
        run: bun run check

      - name: Typecheck and test
        working-directory: apps/web
        run: bun run check

      - name: Build site
        working-directory: apps/web
        # 与已验证的托管构建配置一致：4 个静态生成 worker。
        env:
          CIRCLE_NODE_TOTAL: '5'
        run: |
          # 从仓库加载导出优化，不依赖自托管机的 /etc 路径。
          export_hook="$GITHUB_WORKSPACE/scripts/ci/runner/next-export-links.cjs"
          if [ -f "$export_hook" ]; then
            export ASTRODX_CI_EXPORT_LINKS=1
            export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--require $export_hook"
          fi
          if [ -r /sys/fs/cgroup/memory.events ]; then
            printf 'Before build: memory events\n'
            cat /sys/fs/cgroup/memory.events
          fi
          bun run build

      # Static export is complete; only out/, trace and .next/cache are needed.
      # Remove the duplicate generated server files while their metadata is hot,
      # before packaging can evict it and the next checkout has to cold-delete it.
      - name: Inspect export and trim static build intermediates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [event for line in Path("apps/web/.next/trace").read_text().splitlines() for event in json.loads(line)]
          for name in ("next-build", "static-generation", "output-export-full-static-export"):
              durations = [event["duration"] / 1_000_000 for event in events if event["name"] == name]
              if durations:
                  print(f"Next trace {name}: {max(durations):.3f} seconds")
          PY
          test -f apps/web/out/index.html
          du -sh apps/web/.next/server apps/web/out
          started=$SECONDS
          rm -rf -- apps/web/.next/server
          printf 'Intermediate cleanup: %s seconds\n' "$((SECONDS - started))"
          for metric in /sys/fs/cgroup/memory.events /sys/fs/cgroup/io.pressure; do
            if [ -r "$metric" ]; then cat "$metric"; fi
          done
