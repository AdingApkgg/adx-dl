name: Community check

# 社区站的检查：lint、类型检查、单元与集成测试、构建、对构建产物的 HTTP 测试、
# Docker 构建（只构建不推送）。部署是在 g510 上手动做的，不经 GitHub。
on:
  push:
    branches:
      - main
      - dev
      - pre
    paths:
      - "apps/community/**"
      - "packages/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "biome.jsonc"
      - ".github/workflows/community-check.yml"
  pull_request:
    paths:
      - "apps/community/**"
      - "packages/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "biome.jsonc"
      - ".github/workflows/community-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 公开仓库的 PR 留在 GitHub runner；自托管 runner 另有主机侧事件白名单。
    runs-on: ${{ fromJSON(((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/pre"]'), github.ref)) && '["self-hosted","linux","x64","astrodx-ci"]' || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: community
          POSTGRES_PASSWORD: community
          POSTGRES_DB: community_test
        options: >-
          --health-cmd "pg_isready -U community -d community_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - "5432"
      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - "6379"
    steps:
      # 同一物理机的多个 runner 可以并发运行，服务不能抢固定宿主端口。
      # job.services 在 step 中才可用，不能放进 job 级 env。
      - name: Configure test service endpoints
        env:
          TEST_DATABASE_URL: postgres://community:community@localhost:${{ job.services.postgres.ports['5432'] }}/community_test
          TEST_REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
        run: |
          printf 'TEST_DATABASE_URL=%s\nTEST_REDIS_URL=%s\n' "$TEST_DATABASE_URL" "$TEST_REDIS_URL" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # 自托管镜像不预装系统 Node；依赖安装、CLI 的 node shebang 和 vitest 都需要它。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 共享界面包（@astrodx/ui）的类型检查和测试；它的 lint 由仓库根目录的 biome（web-check）负责。
      - name: Typecheck and test the shared UI package
        working-directory: packages/ui
        run: bun run check

      # check：lint、编译文案、类型检查、bun test（单元、集成、服务端渲染），最后是 vitest run（交互测试）。
      - name: Lint, typecheck and test
        working-directory: apps/community
        run: bun run check

      - name: Build
        working-directory: apps/community
        run: bun run build

      # 也检查服务端产物只 import 生产依赖（test/http/build-output.test.ts）：镜像只装这些。
      - name: HTTP tests against the built server
        working-directory: apps/community
        run: bun run test:http

      # 生产的 compose 文件只在 g510 上用。拿 .env.example 把空着的项填上占位值，确认它解析得了、它要的变量
      # .env.example 里都有（缺了会报 required variable … is missing a value）。
      - name: Validate the production compose file
        working-directory: apps/community
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > "$RUNNER_TEMP/compose.env"
          docker compose --env-file "$RUNNER_TEMP/compose.env" -f compose.yaml config --quiet

      # 构建只在部署时才跑，构建坏了就要到部署时才发现（dash 踩过的坑）。
      - name: Docker build
        run: docker build -f apps/community/Dockerfile -t "community:ci-${{ github.run_id }}-${{ github.run_attempt }}" .

      # 自托管 Docker daemon 会跨 job 保留；只删本次镜像，不动其它 job 的 tag 或构建缓存。
      - name: Remove this run's CI image
        if: always()
        run: |
          image="community:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if docker image inspect "$image" >/dev/null 2>&1; then
            docker image rm "$image"
          fi
